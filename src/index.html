<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>GlassTV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="backdrop"></div>

  <div id="app">
    <header>
      <h1>GlassTV</h1>
      <nav id="tabs"></nav>
      <span class="spacer"></span>
      <button id="btn-search" class="tab focusable">Suche</button>
      <button id="btn-guide" class="tab focusable">Guide</button>
      <button id="btn-settings" class="tab focusable">Einstellungen</button>
    </header>
    <main id="content"></main>
  </div>

  <div id="player">
    <video id="video" preload="none"></video>
    <!--
      Mini-Ansicht: Der Fernseher rendert Video auf einer Hardware-Ebene, die
      sich weder per CSS noch über eine erreichbare Luna-API verkleinern lässt
      (auf dem Gerät geprüft: setDisplayWindow gibt es dort nicht). Verkleinert
      man nur das <video>, läuft der TON weiter, das BILD bleibt schwarz.
      Deshalb deckt die Mini-Ansicht das Videofeld bewusst mit dem Cover ab und
      sagt klar, dass gerade nur der Ton läuft.
    -->
    <div id="mini-cover">
      <img id="mini-image" alt="">
      <div id="mini-note">♪ Ton läuft weiter</div>
    </div>
    <div id="mini-hit" class="focusable" tabindex="0"></div>
    <div id="mini-bar"><span id="mini-title"></span></div>
    <div id="player-chrome">
      <div>
        <div id="player-title"></div>
        <div id="player-sub"></div>
      </div>
      <div>
        <div id="player-scrub"><div id="player-scrub-fill"></div></div>
        <div id="player-times"></div>
        <div id="player-hint">OK = Pause · ◀ ▶ = 10 s spulen bzw. Sender wechseln · Zurück = schließen</div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
