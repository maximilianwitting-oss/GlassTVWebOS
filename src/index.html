<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>GlassTV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="backdrop"></div>

  <div id="app">
    <header>
      <h1>GlassTV</h1>
      <nav id="tabs"></nav>
      <span class="spacer"></span>
      <button id="btn-search" class="tab focusable">Suche</button>
      <button id="btn-guide" class="tab focusable">Guide</button>
      <button id="btn-settings" class="tab focusable">Einstellungen</button>
    </header>
    <main id="content"></main>
  </div>

  <div id="player">
    <video id="video" preload="none"></video>
    <div id="player-chrome">
      <div>
        <div id="player-title"></div>
        <div id="player-sub"></div>
      </div>
      <div>
        <div id="player-scrub"><div id="player-scrub-fill"></div></div>
        <div id="player-times"></div>
        <div id="player-hint">OK = Pause · ◀ ▶ = 10 s spulen bzw. Sender wechseln · Zurück = schließen</div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!--
    Offizielle LG-Bibliothek (Apache 2.0, siehe lib/HERKUNFT.md). Muss VOR
    app.js stehen: Ohne sie ist `webOS` undefiniert, und weil appinfo.json
    `disableBackHistoryAPI` setzt, käme man mit der Zurück-Taste nicht mehr
    aus der App heraus.
  -->
  <script src="lib/webOSTV.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
